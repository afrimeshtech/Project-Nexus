# AfriMesh on a single server: the app, PostgreSQL and Caddy for HTTPS.
#
#   cd deploy && docker compose up -d --build
#
# Everything reads deploy/.env (copy .env.example). Only Caddy is reachable
# from outside; the app and the database sit on the compose network.

name: afrimesh

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afrimesh
      POSTGRES_DB: afrimesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afrimesh -d afrimesh']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://afrimesh:${POSTGRES_PASSWORD}@db:5432/afrimesh
    volumes:
      # Uploaded logos and product photos. Next only serves files that were in
      # public/ at build time, so Caddy serves this volume directly at /uploads.
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # One-off database jobs: schema, demo data, demo passwords. Not started by
  # `up`; run with `docker compose run --rm tools npm run <script>`.
  # The build stage carries the source and dev dependencies the scripts need.
  tools:
    build:
      context: ..
      target: build
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://afrimesh:${POSTGRES_PASSWORD}@db:5432/afrimesh
      # npm needs a writable home for its cache; uid 1001 has none here.
      HOME: /tmp
    # Same user as the app, so logos the seed writes stay writable by the app.
    user: '1001:1001'
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
